<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4edda" />
    <meta

    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Pairs with public/404.html: if we arrived here via the GitHub Pages
      // fallback, swap the placeholder URL for the real one before the app
      // (and its router) ever renders, so it starts on the right page.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get("redirect");
        if (redirectPath) {
          window.history.replaceState(null, "", "/" + redirectPath);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Harshit Bhalani / Field Notes</title>
    <script>
      // GitHub Pages has no server-side routing, so it serves this file for
      // any path it doesn't recognize (e.g. a direct visit to /projects).
      // Encode the intended path into a query string and send the browser
      // back to index.html, which reads it and restores the real URL below.
      var loc = window.location;
      var redirectPath =
        loc.pathname.slice(1) + loc.search + loc.hash;
      loc.replace(loc.origin + "/?redirect=" + encodeURIComponent(redirectPath));
    </script>
  </head>
  <body></body>
</html>
